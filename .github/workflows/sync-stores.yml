name: Sync store locator

on:
  push:
    branches:
      - main
    paths:
      - "scripts/sync-store-data.mjs"
      - ".github/workflows/sync-stores.yml"
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: store-locator-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate and generate store data
        run: node scripts/sync-store-data.mjs

      - name: Publish changes
        shell: bash
        run: |
          if git diff --quiet -- docs/store-data.js; then
            echo "Store data is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/store-data.js
          git commit -m "Sync store locator data"
          git push

